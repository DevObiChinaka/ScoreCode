services:
  db:
    image: postgres:16-alpine
    container_name: scorecode_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scorecode
      POSTGRES_USER: sc
      POSTGRES_PASSWORD: sc_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sc -d scorecode"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
