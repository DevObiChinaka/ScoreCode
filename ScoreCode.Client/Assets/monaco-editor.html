<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ScoreCode Editor</title>
    <style>
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('monaco/fonts/JetBrainsMono-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('monaco/fonts/JetBrainsMono-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0D12; }
        #editor-container { width: 100%; height: 100%; }
        /* Overflow widgets (suggest/hover) are positioned by Monaco itself via
           the `fixedOverflowWidgets: true` editor option. Do NOT override
           .overflow-guard / .overflowingContentWidgets here — manual overrides
           fight Monaco's layout and mis-place the suggestion popup. */

        /* Cosmetics only — nothing here affects size or position, so the popup
           still lands exactly where Monaco puts it. Colours come from the theme's
           editorSuggestWidget.* tokens, so this works in light and dark alike. */
        .monaco-editor .suggest-widget,
        .monaco-editor .parameter-hints-widget,
        .monaco-editor .monaco-hover {
            border-radius: 10px;
            box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.45);
        }
        /* The description column reads better proportional than monospaced. */
        .monaco-editor .suggest-widget .monaco-list .monaco-list-row > .contents > .main > .right,
        .monaco-editor .suggest-widget .details .monaco-scrollable-element {
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div id="editor-container"></div>

    <script src="monaco/vs/loader.js"></script>
    <script>

                { l: 'display',       k: 'Property', i: 'display: ${1:flex};',              d: 'Display property' },
                { l: 'flex',          k: 'Snippet',  i: 'display: flex;\njustify-content: ${1:center};\nalign-items: ${2:center};', d: 'Flexbox' },
                { l: 'grid',          k: 'Snippet',  i: 'display: grid;\ngrid-template-columns: ${1:1fr 1fr};\ngap: ${2:1rem};', d: 'CSS Grid' },
                { l: 'margin',        k: 'Property', i: 'margin: ${1:0};',                  d: 'Margin' },
                { l: 'padding',       k: 'Property', i: 'padding: ${1:0};',                 d: 'Padding' },
                { l: 'width',         k: 'Property', i: 'width: ${1:100%};',                d: 'Width' },
                { l: 'height',        k: 'Property', i: 'height: ${1:auto};',               d: 'Height' },
                { l: 'color',         k: 'Property', i: 'color: ${1:#333};',                d: 'Text color' },
                { l: 'background',    k: 'Property', i: 'background: ${1:#fff};',           d: 'Background' },
                { l: 'background-color', k: 'Property', i: 'background-color: ${1:#fff};',  d: 'BG color' },
                { l: 'font-size',     k: 'Property', i: 'font-size: ${1:16px};',            d: 'Font size' },
                { l: 'font-weight',   k: 'Property', i: 'font-weight: ${1:bold};',          d: 'Font weight' },
                { l: 'font-family',   k: 'Property', i: "font-family: ${1:'Arial'}, sans-serif;", d: 'Font family' },
                { l: 'border',        k: 'Property', i: 'border: ${1:1px} ${2:solid} ${3:#ccc};', d: 'Border' },
                { l: 'border-radius', k: 'Property', i: 'border-radius: ${1:4px};',        d: 'Border radius' },
                { l: 'box-shadow',    k: 'Property', i: 'box-shadow: ${1:0} ${2:2px} ${3:4px} ${4:rgba(0,0,0,0.1)};', d: 'Box shadow' },
                { l: 'text-align',    k: 'Property', i: 'text-align: ${1:center};',        d: 'Text align' },
                { l: 'position',      k: 'Property', i: 'position: ${1:relative};',        d: 'Position' },
                { l: 'transition',    k: 'Property', i: 'transition: ${1:all} ${2:0.3s} ${3:ease};', d: 'Transition' },
                { l: 'transform',     k: 'Property', i: 'transform: ${1:none};',           d: 'Transform' },
                { l: 'opacity',       k: 'Property', i: 'opacity: ${1:1};',                d: 'Opacity' },
                { l: 'overflow',      k: 'Property', i: 'overflow: ${1:hidden};',           d: 'Overflow' },
                { l: 'media',         k: 'Snippet',  i: '@media (max-width: ${1:768px}) {\n\t${2}\n}', d: 'Media query' },
                { l: 'keyframes',     k: 'Snippet',  i: '@keyframes ${1:name} {\n\tfrom { ${2} }\n\tto { ${3} }\n}', d: 'Keyframes' },
            ],
        };

        function registerCompletions(monaco) {
            for (const [langId, items] of Object.entries(LANG_COMPLETIONS)) {
                monaco.languages.registerCompletionItemProvider(langId, {
                    provideCompletionItems: function (model, position) {
                        // Honour the lecturer's IntelliSense toggle even for
                        // manually-triggered (Ctrl+Space) completions.
                        if (!intelliSenseEnabled) return { suggestions: [] };
                        const word = model.getWordUntilPosition(position);
                        const range = {
                            startLineNumber: position.lineNumber,
                            endLineNumber:   position.lineNumber,
                            startColumn:     word.startColumn,
                            endColumn:       word.endColumn
                        };
                        return {
                            suggestions: items.map(c => ({
                                label:           c.l,
                                kind:            monaco.languages.CompletionItemKind[c.k] || monaco.languages.CompletionItemKind.Text,
                                insertText:      c.i,
                                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                                detail:          c.d,
                                range:           range
                            }))
                        };
                    }
                });
            }
        }

        // ── Initialize Monaco ─────────────────────────────────────────────
        require.config({
            paths: { vs: 'monaco/vs' }
        });

        require(['vs/editor/editor.main'], function () {
            try {
                defineTheme(monaco);
                registerCompletions(monaco);

                editor = monaco.editor.create(document.getElementById('editor-container'), {
                    value: '',
                    language: 'python',
                    theme: 'scorecode-dark',
                    fontFamily: "'JetBrains Mono', 'Consolas', monospace",
                    fontSize: 14,
                    lineHeight: 22,
                    minimap: { enabled: true, scale: 2 },
                    scrollBeyondLastLine: false,
                    roundedSelection: true,
                    cursorBlinking: 'smooth',
                    cursorSmoothCaretAnimation: 'on',
                    smoothScrolling: true,
                    padding: { top: 12, bottom: 12 },
                    renderLineHighlight: 'gutter',
                    automaticLayout: true,
                    wordWrap: 'off',
                    tabSize: 4,
                    insertSpaces: true,
                    bracketPairColorization: { enabled: true },
                    guides: { bracketPairs: true, indentation: true },
                    suggestOnTriggerCharacters: true,
                    quickSuggestions: true,
                    parameterHints: { enabled: true },
                    fixedOverflowWidgets: true,

                    // ── Suggestion popup behaviour ────────────────────────
                    // The list is proportional and slightly smaller than the code
                    // so it reads as a menu rather than a second editor pane.
                    suggestFontSize: 13,
                    suggestLineHeight: 20,
                    // 'smart' only steals Enter when a suggestion is actively
                    // selected, so pressing Enter for a newline still works.
                    acceptSuggestionOnEnter: 'smart',
                    tabCompletion: 'on',
                    suggestSelection: 'first',
                    snippetSuggestions: 'inline',
                    suggest: {
                        showIcons: true,
                        showStatusBar: true,
                        preview: true,          // ghost-text preview of the insertion
                        filterGraceful: true,   // tolerate small typos while filtering
                        localityBonus: true,    // favour identifiers used nearby
                        showWords: true,
                        insertMode: 'insert',
                    },
                });

                // ── Fix caret/glyph misalignment ──────────────────────────
                // Monaco measures glyph widths at create-time; if the JetBrains
                // Mono web font hasn't finished loading it measures the Consolas
                // fallback, then re-renders with a different font once it loads —
                // so the caret drifts. Re-measure once the real font is ready.
                function remeasure() {
                    try { monaco.editor.remeasureFonts(); } catch (e) { }
                }
                if (document.fonts) {
                    document.fonts.load("14px 'JetBrains Mono'").then(remeasure).catch(remeasure);
                    if (document.fonts.ready) document.fonts.ready.then(remeasure);
                }

                // Notify WPF that editor is ready
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({
                        type: 'ready'
                    }));
                }

                // Track dirty state (WPF pulls code on demand instead of receiving it)
                let _dirty = false;
                editor.onDidChangeModelContent(() => { _dirty = true; });
            } catch (err) {
                // Report error to WPF so it surfaces in the UI
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({
                        type: 'error',
                        message: 'Editor init failed: ' + err.message
                    }));
                }
            }
        }, function (err) {
            // require.js load error callback
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({
                    type: 'error',
                    message: 'Failed to load Monaco: ' + (err.message || err)
                }));
            }
        });

        // ── API callable from WPF via ExecuteScriptAsync ──────────────────

        function setValue(code) {
            if (editor) {
                editor.setValue(code);
                editor.setPosition({ lineNumber: 1, column: 1 });
            }
        }

        function getValue() {
            return editor ? editor.getValue() : '';
        }

        function setLanguage(lang) {
            if (editor) {
                const model = editor.getModel();
                if (model) {
                    monaco.editor.setModelLanguage(model, lang);
                }
            }
        }

        function getLanguage() {
            if (editor) {
                const model = editor.getModel();
                return model ? model.getLanguageId() : '';
            }
            return '';
        }

        // ── Full state serialization (cursor + scroll + code + language) ──

        function getEditorState() {
            if (!editor) return JSON.stringify({});
            var pos = editor.getPosition();
            return JSON.stringify({
                code: editor.getValue(),
                language: editor.getModel().getLanguageId(),
                cursorLine: pos ? pos.lineNumber : 1,
                cursorColumn: pos ? pos.column : 1,
                scrollTop: editor.getScrollTop()
            });
        }

        function setEditorState(stateJson) {
            if (!editor) return;
            var s = JSON.parse(stateJson);
            if (s.language) {
                monaco.editor.setModelLanguage(editor.getModel(), s.language);
            }
            editor.setValue(s.code || '');
            if (s.cursorLine) {
                editor.setPosition({
                    lineNumber: s.cursorLine,
                    column: s.cursorColumn || 1
                });
            }
            if (s.scrollTop) {
                editor.setScrollTop(s.scrollTop);
            }
            _dirty = false;
            editor.focus();
        }

        // ── Dirty flag (WPF polls on autosave, pulls code on demand) ──

        function isDirtyFlag() { return _dirty; }
        function clearDirtyFlag() { _dirty = false; }

        // ── Existing API ──

        function setReadOnly(readOnly) {
            if (editor) {
                editor.updateOptions({ readOnly: readOnly });
            }
        }

        function setIntelliSense(enabled) {
            // Coerce: WPF passes the literal true/false via ExecuteScriptAsync.
            enabled = (enabled === true || enabled === 'true');
            intelliSenseEnabled = enabled;
            if (editor) {
                editor.updateOptions({
                    quickSuggestions: enabled,
                    suggestOnTriggerCharacters: enabled,
                    parameterHints: { enabled: enabled },
                    wordBasedSuggestions: enabled ? 'currentDocument' : 'off'
                });
                // Dismiss any popup that may already be showing when turning off.
                if (!enabled) {
                    editor.trigger('scorecode', 'hideSuggestWidget', {});
                }
            }
        }

        function disableCopyPaste() {
            if (editor) {
                editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyC, () => {});
                editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyV, () => {});
                editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyX, () => {});
                editor.updateOptions({ contextmenu: false });
            }
        }

        function focusEditor() {
            if (editor) editor.focus();
        }

        function setTheme(themeName) {
            if (editor && monaco) {
                monaco.editor.setTheme(themeName);
                // Update body background to match
                var bg = themeName === 'scorecode-light' ? '#FFFFFF' : '#0A0D12';
                document.body.style.background = bg;
                document.documentElement.style.background = bg;
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (editor) editor.layout();
        });
    </script>
</body>
</html>
